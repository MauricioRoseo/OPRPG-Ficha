<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <h1>Criar Personagem</h1>

  <form id="form-personagem">
    <label>Nome: <input type="text" name="name" required /></label><br />
    <label>Idade: <input type="number" name="age" required /></label><br />
    <label>Jogador: <input type="text" name="player" required /></label><br />
    <label>Classe: <input type="text" name="class" required /></label><br />
    <label>Trilha: <input type="text" name="trail" required /></label><br />
    <label>Afinidade: <input type="text" name="afinity" required /></label><br />
    <label>Origem: <input type="text" name="origin" required /></label><br />
    <label>Patente: <input type="text" name="patent" required /></label><br />
    <label>NEX: <input type="number" name="NEX" required /></label><br />
    <label>FOR: <input type="number" name="FOR" required /></label><br />
    <label>AGI: <input type="number" name="AGI" required /></label><br />
    <label>INT: <input type="number" name="INT" required /></label><br />
    <label>VIG: <input type="number" name="VIG" required /></label><br />
    <label>PRE: <input type="number" name="PRE" required /></label><br /><br />

    <button type="submit">Criar Personagem</button>
  </form>

  <div id="resposta"></div>

  <!-- Script externo -->
  <script src="js/formularioPersonagem.js"></script>
</body>
</html>
