<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editar Ficha | Occulta Artificia</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header>
    <h1>Editar Ficha do Agente</h1>
  </header>

  <main>
    <section class="form-section">
      <form id="editarFichaForm" class="ficha-form">
        <div class="form-grid">
          <div>
            <label for="name">Nome:</label>
            <input type="text" id="name" name="name" required />
          </div>

          <!-- ADICIONEI O CAMPO age (era obrigatório no schema) -->
          <div>
            <label for="age">Idade:</label>
            <input type="number" id="age" name="age" min="0" required />
          </div>

          <div>
            <label for="player">Jogador:</label>
            <input type="text" id="player" name="player" required />
          </div>
          <div>
            <label for="class">Classe:</label>
            <input type="text" id="class" name="class" />
          </div>
          <div>
            <label for="trail">Trilha:</label>
            <input type="text" id="trail" name="trail" />
          </div>
          <div>
            <label for="origin">Origem:</label>
            <input type="text" id="origin" name="origin" />
          </div>
          <div>
            <label for="patent">Patente:</label>
            <input type="text" id="patent" name="patent" />
          </div>
          <div>
            <label for="afinity">Afinidade:</label>
            <input type="text" id="afinity" name="afinity" />
          </div>
          <div>
            <label for="NEX">NEX (%):</label>
            <input type="number" id="NEX" name="NEX" min="0" max="99" />
          </div>
        </div>

        <hr>

        <div class="form-grid">
          <div><label for="FOR">FOR:</label><input type="number" id="FOR" name="FOR" /></div>
          <div><label for="AGI">AGI:</label><input type="number" id="AGI" name="AGI" /></div>
          <div><label for="INT">INT:</label><input type="number" id="INT" name="INT" /></div>
          <div><label for="VIG">VIG:</label><input type="number" id="VIG" name="VIG" /></div>
          <div><label for="PRE">PRE:</label><input type="number" id="PRE" name="PRE" /></div>
        </div>

        <div class="btn-area">
          <button type="submit" class="btn btn-save">💾 Salvar</button>
          <button type="button" class="btn btn-cancel" id="cancelBtn">❌ Cancelar</button>
        </div>
      </form>
    </section>
  </main>

  <footer>
    <p>Occulta Artificia © 2025 — Sistema de Fichas</p>
  </footer>

  <script src="./js/editarFicha.js"></script>
</body>
</html>
